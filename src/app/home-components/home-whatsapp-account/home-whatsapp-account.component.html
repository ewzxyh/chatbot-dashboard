<mat-card class="home-channel-card">
  <mat-card-content class="home-channel-card__content">
    <div class="home-channel-card__icon" aria-hidden="true">
      <mat-icon svgIcon="td-brand-whatsapp"></mat-icon>
    </div>

    <div class="home-channel-card__body">
      <span class="home-channel-card__eyebrow">Canal de atendimento</span>
      <h2 class="home-channel-card__title">WhatsApp Business</h2>
      <p class="home-channel-card__description">
        Conecte ou gerencie seu canal para receber, organizar e responder conversas do WhatsApp pelo ChatCase.
      </p>
    </div>

    <div class="home-channel-card__actions">
      <button
        mat-flat-button
        color="primary"
        class="home-channel-card__button"
        type="button"
        (click)="gotToLearMoreOrManageApp()">
        <mat-icon svgIcon="td-plug-connected"></mat-icon>
        Gerenciar canal
      </button>
    </div>
  </mat-card-content>
</mat-card>
