<div class="convesations-analytics-report-wpr">
  <div class="home-convs-card">
    <div class="home-convs-header">
      <div class="home-convs-heading">
        <div class="graph-title">
          Gráfico de conversas
        </div>
        <ng-container *ngIf="PERMISSION_TO_VIEW_ANALYTICS">
          <button
            *ngIf="USER_ROLE !== 'agent' && isVisibleANA"
            class="home-convs-link"
            type="button"
            (click)="goToRequestsAnalytics()">
            <span>Ver em Analytics</span>
            <span class="material-icons m-i-arrow-on-black">
              keyboard_arrow_right
            </span>
          </button>
        </ng-container>
      </div>

      <div class="home-convs-actions">
        <button
          [ngClass]="{'active-period': numOfDays === 30}"
          class="period-switch-btn"
          type="button"
          (click)="selectConversationsRange(30)">
          Últimos 30 dias
        </button>

        <button
          [ngClass]="{'active-period': numOfDays === 7}"
          class="period-switch-btn"
          type="button"
          (click)="selectConversationsRange(7)">
          Últimos 7 dias
        </button>
      </div>
    </div>

    <div class="home-convs-chart">
      <canvas id="lastNdayChart"></canvas>
    </div>
  </div>

  <div class="graph-footer">
    <div class="graph-footer-item">
      <span class="graph-footer-num">
        <!-- {{totalHuman + totalBot | number:'1.0-0'}} -->
        {{totalHuman  | number:'1.0-0'}}
      </span>
      <!-- <span *ngIf="numOfDays === 7" class="graph-footer-num">  {{countOfLastSevenDaysRequests + countOfLastSevenDaysRequestsHandledByBot | number:'1.0-0'}} </span>
      <span *ngIf="numOfDays === 30" class="graph-footer-num"> {{countOfLastMonthRequests | number:'1.0-0'}} </span> -->
      <span class="graph-footer-text">Total</span>
    </div>

    <div class="graph-footer-item">
      <span class="graph-footer-num">
        {{totalBot | number:'1.0-0'}}
      </span>
      <!-- <span *ngIf="numOfDays === 7" class="graph-footer-num"> {{countOfLastSevenDaysRequestsHandledByBot | number:'1.0-0'}} </span>
      <span *ngIf="numOfDays === 30" class="graph-footer-num"> {{countOfLastMonthRequestsHandledByBots | number:'1.0-0'}}</span> -->
      <span class="graph-footer-text">Atendidas por bots</span>
    </div>

    <div class="graph-footer-item">
      <span class="graph-footer-num">
        {{percentageOfRequestsHandledByBots}}<span class="home-percentage-symbol">%</span>
      </span>
      <!-- <span *ngIf="numOfDays === 7" class="graph-footer-num"> {{percentageOfSevenDaysRequestsHandledByBots}}% </span>
      <span *ngIf="numOfDays === 30" class="graph-footer-num"> {{percentageOfLastMonthRequestsHandledByBots}}% </span> -->
      <span class="graph-footer-text">% atendidas por bots</span>
    </div>
  </div>
</div>
