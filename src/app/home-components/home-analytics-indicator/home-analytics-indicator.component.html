<section class="home-analytics" aria-label="Resumo de métricas">
  <header class="home-analytics__header">
    <h2 class="home-analytics__title">Resumo de métricas</h2>
    <span class="home-analytics__period">30 dias</span>
  </header>

  <div class="home-analytics__grid">
    <mat-card class="home-analytics-card">
      <mat-card-content class="home-analytics-card__content">
        <div class="home-analytics-card__icon" aria-hidden="true">
          <mat-icon svgIcon="td-address-book"></mat-icon>
        </div>
        <div class="home-analytics-card__body">
          <span class="home-analytics-card__label">Contatos ativos</span>
          <strong class="home-analytics-card__value">{{ (countOfActiveContacts || 0) | number:'1.0-0' }}</strong>
          <span class="home-analytics-card__meta">Total atual</span>
        </div>
        <button
          *ngIf="PERMISSION_TO_VIEW_ANALYTICS && USER_ROLE !== 'agent' && isVisibleANA"
          mat-stroked-button
          color="primary"
          class="home-analytics-card__action"
          type="button"
          (click)="goToContacts()">
          Ver contatos
          <mat-icon svgIcon="td-chevron-right"></mat-icon>
        </button>
      </mat-card-content>
    </mat-card>

    <mat-card class="home-analytics-card">
      <mat-card-content class="home-analytics-card__content">
        <div class="home-analytics-card__icon" aria-hidden="true">
          <mat-icon svgIcon="td-world"></mat-icon>
        </div>
        <div class="home-analytics-card__body">
          <span class="home-analytics-card__label">Visitantes únicos</span>
          <strong class="home-analytics-card__value">{{ (countOfVisitors || 0) | number:'1.0-0' }}</strong>
          <span class="home-analytics-card__meta">Acessos identificados</span>
        </div>
        <button
          *ngIf="PERMISSION_TO_VIEW_ANALYTICS && USER_ROLE !== 'agent' && isVisibleANA"
          mat-stroked-button
          color="primary"
          class="home-analytics-card__action"
          type="button"
          (click)="goToVisitorsAnalytics()">
          Ver visitantes
          <mat-icon svgIcon="td-chevron-right"></mat-icon>
        </button>
      </mat-card-content>
    </mat-card>

    <mat-card class="home-analytics-card">
      <mat-card-content class="home-analytics-card__content">
        <div class="home-analytics-card__icon" aria-hidden="true">
          <mat-icon svgIcon="td-message"></mat-icon>
        </div>
        <div class="home-analytics-card__body">
          <span class="home-analytics-card__label">Mensagens</span>
          <strong class="home-analytics-card__value">{{ (countOfLastMonthMsgs || 0) | number:'1.0-0' }}</strong>
          <span class="home-analytics-card__meta">Recebidas no período</span>
        </div>
        <button
          *ngIf="PERMISSION_TO_VIEW_ANALYTICS && USER_ROLE !== 'agent' && isVisibleANA"
          mat-stroked-button
          color="primary"
          class="home-analytics-card__action"
          type="button"
          (click)="goToMessagesAnalytics()">
          Ver mensagens
          <mat-icon svgIcon="td-chevron-right"></mat-icon>
        </button>
      </mat-card-content>
    </mat-card>
  </div>
</section>
