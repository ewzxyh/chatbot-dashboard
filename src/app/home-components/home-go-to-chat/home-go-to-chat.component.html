<mat-card class="home-chat-card">
  <mat-card-content class="home-chat-card__content">
    <div class="home-chat-card__icon" aria-hidden="true">
      <mat-icon svgIcon="td-message" aria-hidden="true"></mat-icon>
    </div>

    <div class="home-chat-card__body">
      <span class="home-chat-card__eyebrow">Atendimento em tempo real</span>
      <h2 class="home-chat-card__title">Abra o bate-papo</h2>
      <p class="home-chat-card__description">
        Acompanhe conversas novas e responda aos contatos diretamente pela caixa de atendimento.
      </p>
    </div>

    <div class="home-chat-card__actions">
      <button mat-flat-button color="primary" class="home-chat-card__button" type="button" (click)="openChat()">
        <mat-icon svgIcon="td-message" aria-hidden="true"></mat-icon>
        Abrir chat
      </button>
    </div>
  </mat-card-content>
</mat-card>
