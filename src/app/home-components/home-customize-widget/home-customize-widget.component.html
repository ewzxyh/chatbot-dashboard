<mat-card class="home-widget-card">
    <mat-card-content class="home-widget-card__content">
        <div class="home-widget-card__icon" aria-hidden="true">
            <mat-icon svgIcon="td-brush" aria-hidden="true"></mat-icon>
        </div>

        <div class="home-widget-card__body">
            <span class="home-widget-card__eyebrow">Experiência do visitante</span>
            <h2 class="home-widget-card__title">Personalize seu widget</h2>
            <p class="home-widget-card__description">
                Ajuste cores, mensagens e visibilidade para manter o atendimento com a identidade da sua marca.
            </p>
        </div>

        <div class="home-widget-card__meta" aria-label="Itens configuráveis">
            <span>
                <mat-icon svgIcon="td-message" aria-hidden="true"></mat-icon>
                Mensagens
            </span>
            <span>
                <mat-icon svgIcon="td-settings" aria-hidden="true"></mat-icon>
                Aparência
            </span>
        </div>

        <div class="home-widget-card__actions">
            <button mat-flat-button color="primary" class="home-widget-card__button" type="button" [disabled]="!project?._id" (click)="goToWidgetSetUp()">
                <mat-icon svgIcon="td-brush" aria-hidden="true"></mat-icon>
                Configurar widget
            </button>
        </div>
    </mat-card-content>
</mat-card>
