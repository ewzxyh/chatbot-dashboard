<div class="main-content flow-webhooks-page">
    <div class="flow-webhooks-shell">
        <header class="flow-webhooks-header">
            <span>Fluxos</span>
            <h1>Webhooks</h1>
        </header>

        <appdashboard-bots-sidebar class="bots-top-navigation"
            [allTemplatesCount]="allTemplatesCount"
            [allCommunityTemplatesCount]="allCommunityTemplatesCount"
            [customerSatisfactionTemplatesCount]="customerSatisfactionTemplatesCount"
            [increaseSalesTemplatesCount]="increaseSalesTemplatesCount"
            [chatBotCount]="chatBotCount"
            [myChatbotOtherCount]="myChatbotOtherCount"
            [automationsCount]="automationsCount"
            [flowWebhooksCount]="flowWebhooksCount"
            [customerSatisfactionBotsCount]="customerSatisfactionBotsCount"
            [increaseSalesBotsCount]="increaseSalesBotsCount">
        </appdashboard-bots-sidebar>

        <main class="flow-webhooks-content">
            <loading-spinner *ngIf="showSpinner"></loading-spinner>

            <section *ngIf="!showSpinner && flowWebhooks?.length === 0" class="flow-webhooks-empty">
                <mat-icon aria-hidden="true" svgIcon="td-webhook"></mat-icon>
                <h2>Ainda não tem nenhum webhook nas suas automações</h2>
                <p>Crie uma automação com Webhook para conectar o ChatCase aos seus outros sistemas.</p>
                <button type="button" class="flow-webhooks-primary-action" (click)="goToAutomations()">
                    Criar automação
                </button>
            </section>

            <section *ngIf="!showSpinner && flowWebhooks?.length" class="flow-webhooks-list"
                aria-label="Webhooks configurados">
                <article class="flow-webhook-card" *ngFor="let webhook of flowWebhooks; let i = index">
                    <div class="flow-webhook-info">
                        <div class="flow-webhook-logo" aria-hidden="true">
                            <img src="assets/img/logos/webhook-logo.svg" alt="">
                        </div>

                        <div class="flow-webhook-copy">
                            <h2>{{ webhook?.name || 'N/A' }}</h2>
                            <div class="flow-webhook-url">
                                <span #copyText>{{ webhook?.url }}</span>
                                <button type="button" class="copy-container"
                                    aria-label="Copiar URL do webhook"
                                    (click)="copyToClipboard(copyText, 'item-' + i)"
                                    [disabled]="!PERMISSION_TO_COPY_WEBHOOK_URL"
                                    matTooltipClass="custom-mat-tooltip"
                                    matTooltipPosition="above"
                                    matTooltipHideDelay="100"
                                    [matTooltip]="!PERMISSION_TO_COPY_WEBHOOK_URL ? ('YouDoNotHavePermissions' | translate) : ''"
                                    [matTooltipDisabled]="PERMISSION_TO_COPY_WEBHOOK_URL">
                                    <svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 0 24 24" width="16"
                                        aria-hidden="true">
                                        <path d="M0 0h24v24H0V0z" fill="none"></path>
                                        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"></path>
                                    </svg>
                                    <span class="copied-tooltip" *ngIf="copiedStates['item-' + i]">
                                        {{ 'Copied' | translate }}!
                                    </span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="flow-webhook-actions">
                        <button type="button" class="flow-webhooks-primary-action"
                            (click)="goToFlowWebhookDetail(webhook.webhook_id)">
                            Abrir
                        </button>

                        <div class="wh-onoffswitch"
                            matTooltipClass="custom-mat-tooltip"
                            matTooltipPosition="above"
                            matTooltipHideDelay="100"
                            [matTooltip]="!PERMISSION_TO_ENABLE_DISABLE_WEBHOOK ? ('YouDoNotHavePermissions' | translate) : ''"
                            [matTooltipDisabled]="PERMISSION_TO_ENABLE_DISABLE_WEBHOOK">
                            <input type="checkbox" name="onoffswitch{{ i }}"
                                class="wh-onoffswitch-checkbox" id="whonoffswitch{{ i }}"
                                [checked]="webhook.enabled"
                                (change)="webhookOnOff($event, webhook.webhook_id)"
                                [disabled]="!PERMISSION_TO_ENABLE_DISABLE_WEBHOOK">
                            <label class="wh-onoffswitch-label" for="whonoffswitch{{ i }}">
                                <span class="wh-onoffswitch-inner"></span>
                                <span class="wh-onoffswitch-switch"></span>
                            </label>
                        </div>

                        <button type="button" class="delete-flow-wh"
                            aria-label="Excluir webhook"
                            (click)="deleteWebhook(webhook.webhook_id)"
                            [disabled]="!PERMISSION_TO_DELETE_WEBHOOK"
                            matTooltipClass="custom-mat-tooltip"
                            matTooltipPosition="above"
                            matTooltipHideDelay="100"
                            [matTooltip]="!PERMISSION_TO_DELETE_WEBHOOK ? ('YouDoNotHavePermissions' | translate) : ''"
                            [matTooltipDisabled]="PERMISSION_TO_DELETE_WEBHOOK">
                            <mat-icon aria-hidden="true">delete_outline</mat-icon>
                        </button>
                    </div>
                </article>
            </section>
        </main>
    </div>
</div>
