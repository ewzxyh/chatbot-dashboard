<div class="admin-container">
  <header class="admin-header">
    <h1>Painel Administrativo</h1>
  </header>
  <nav class="admin-nav" aria-label="Navegação administrativa">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive
      #linkActive="routerLinkActive"
      [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
      [class.admin-nav-link-active]="linkActive.isActive"
      [attr.aria-current]="linkActive.isActive ? 'page' : null"
      (click)="setActiveTab(item.id)">
      {{ item.label }}
    </a>
  </nav>
  <div class="admin-content">
    <router-outlet></router-outlet>
  </div>
</div>
