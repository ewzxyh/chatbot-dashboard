<div *ngIf="isLoading" class="admin-loading-state">Carregando...</div>
<div *ngIf="errorMessage" class="admin-error-state">{{ errorMessage }}</div>

<div *ngIf="stats && !isLoading">
  <div class="stats-grid">
    <mat-card class="stat-card">
      <div class="stat-value">{{ stats.totalProjects }}</div>
      <div class="stat-label">Projetos</div>
    </mat-card>
    <mat-card class="stat-card">
      <div class="stat-value">{{ stats.totalUsers }}</div>
      <div class="stat-label">Usuários</div>
    </mat-card>
    <mat-card class="stat-card">
      <div class="stat-value">R$ {{ stats.monthlyRevenue | number:'1.2-2' }}</div>
      <div class="stat-label">Receita mensal estimada</div>
    </mat-card>
  </div>

  <div class="admin-section">
    <h3 class="admin-section-title">Distribuição por plano</h3>
    <div class="plan-distribution">
      <mat-card *ngFor="let key of getPlanKeys()" class="plan-dist-item">
        <span class="plan-dist-name">{{ planDisplayNames[key] || key }}</span>
        <span class="plan-dist-count">{{ stats.planDistribution[key] }}</span>
      </mat-card>
    </div>
  </div>
</div>
