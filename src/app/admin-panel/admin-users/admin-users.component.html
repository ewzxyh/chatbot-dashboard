<div class="admin-filters">
  <input type="text" [(ngModel)]="searchText" placeholder="Buscar por email ou nome..." style="width: 300px;" (keyup.enter)="onSearch()" />
  <button type="button" (click)="onSearch()">Buscar</button>
</div>

<div *ngIf="isLoading" style="text-align: center; padding: 40px;">Carregando...</div>

<table *ngIf="!isLoading">
  <thead>
    <tr><th>Nome</th><th>Email</th><th>Verificado</th><th>Projetos</th><th>Criado em</th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let u of users">
      <td>{{ u.firstname }} {{ u.lastname }}</td>
      <td>{{ u.email }}</td>
      <td><span [style.color]="u.emailverified ? '#4caf50' : '#e53935'">{{ u.emailverified ? 'Sim' : 'Nao' }}</span></td>
      <td>{{ u.projectCount }}</td>
      <td>{{ u.createdAt | date:'dd/MM/yyyy' }}</td>
    </tr>
  </tbody>
</table>

<div class="admin-pagination">
  <span>{{ totalCount }} usuarios | Pagina {{ page + 1 }}</span>
  <div>
    <button type="button" [disabled]="page === 0" (click)="prevPage()">Anterior</button>
    <button type="button" [disabled]="(page + 1) * limit >= totalCount" (click)="nextPage()">Proxima</button>
  </div>
</div>
