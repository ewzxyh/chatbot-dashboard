<div class="admin-filters">
  <mat-form-field appearance="outline" class="admin-filter-field wide">
    <mat-label>Buscar</mat-label>
    <input matInput type="text" [(ngModel)]="searchText" placeholder="Email ou nome" (keyup.enter)="onSearch()" />
  </mat-form-field>
  <button mat-flat-button color="primary" type="button" (click)="onSearch()">Buscar</button>
</div>

<div *ngIf="isLoading" class="admin-loading-state">Carregando...</div>

<table mat-table *ngIf="!isLoading" [dataSource]="users" class="admin-table">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nome</th>
    <td mat-cell *matCellDef="let u">{{ u.firstname }} {{ u.lastname }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let u">{{ u.email }}</td>
  </ng-container>

  <ng-container matColumnDef="verified">
    <th mat-header-cell *matHeaderCellDef>Verificado</th>
    <td mat-cell *matCellDef="let u">
      <span [ngClass]="u.emailverified ? 'admin-state-success' : 'admin-state-error'">{{ u.emailverified ? 'Sim' : 'Não' }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="projects">
    <th mat-header-cell *matHeaderCellDef>Projetos</th>
    <td mat-cell *matCellDef="let u">{{ u.projectCount }}</td>
  </ng-container>

  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef>Criado em</th>
    <td mat-cell *matCellDef="let u">{{ u.createdAt | date:'dd/MM/yyyy' }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<div *ngIf="!isLoading && users.length === 0" class="admin-empty-state">Nenhum usuário encontrado.</div>

<mat-paginator
  *ngIf="!isLoading"
  [length]="totalCount"
  [pageIndex]="page"
  [pageSize]="limit"
  [pageSizeOptions]="[10, 20, 50]"
  showFirstLastButtons
  (page)="onPageChange($event)">
</mat-paginator>
